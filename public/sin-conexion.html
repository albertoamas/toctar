<!doctype html>
<!-- Página sin conexión (HU-06, RNF-03). La guarda public/sw.js y se muestra cuando una navegación
     falla sin internet. Los estilos y el logo van adentro del archivo; las dos fuentes de la marca, en
     public/fuentes/ con nombre fijo, las guarda el service worker junto con esta página (pulido 2.10).
     Colores: tokens del tema oscuro de src/app/globals.css. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<meta name="robots" content="noindex">
<title>Sin conexión · TocTar Detailing</title>
<style>
  /* Las de la app (next/font) cambian de nombre en cada compilación y no se pueden guardar: van copias fijas. */
  @font-face {
    font-family: "Barlow Condensed"; font-style: italic; font-weight: 800; font-display: swap;
    src: url(/fuentes/barlow-condensed-800-italica-latin.woff2) format("woff2");
  }
  @font-face {
    font-family: Montserrat; font-style: normal; font-weight: 400 600; font-display: swap;
    src: url(/fuentes/montserrat-variable-latin.woff2) format("woff2");
  }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px; background: #000000; color: #ffffff; text-align: center;
    font-family: Montserrat, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { display: flex; flex-direction: column; align-items: center; gap: 20px; max-width: 26rem; }
  h1 {
    margin: 0; font-family: "Barlow Condensed", "Arial Narrow", sans-serif; font-style: italic;
    font-weight: 800; font-size: 2.5rem; line-height: 1;
  }
  p { margin: 0; color: #b3b3b3; line-height: 1.5; }
  hr { width: 100%; max-width: 16rem; height: 3px; margin: 0; border: 0; background: #e30613; box-shadow: 0 0 12px rgba(227, 6, 19, 0.65), 0 0 2px rgba(255, 51, 64, 0.9); }
  button {
    font: inherit; font-weight: 600; color: #ffffff; background: #e30613; border: 0;
    border-radius: 2px; padding: 12px 24px; min-height: 44px; cursor: pointer;
  }
  button:hover { background: #c40511; }
  button:focus-visible { outline: 2px solid #ffffff; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 410.00 305.00" width="96" height="72" aria-hidden="true"><g transform="translate(6.00 6.00)"><path fill="#FFFFFF" fill-rule="evenodd" d="M112.99 202.99L82.84 150.64L137.00 52.76L27.52 52.76L0.00 3.73L0.00 0.00L398.00 0.00L369.50 53.24L197.58 53.24Z"/><path fill="#E30613" fill-rule="evenodd" d="M163.82 292.97L134.00 239.15L217.90 90.24L348.00 90.24L318.50 142.99L249.05 142.99Z"/></g></svg>

  <h1>Sin conexión</h1>
  <hr>
  <p>El panel necesita internet. Revisa tu conexión y vuelve a intentar.</p>
  <button type="button" onclick="location.reload()">Reintentar</button>
</main>
</body>
</html>
