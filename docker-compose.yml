# Servicios para desarrollo. La app corre fuera de Docker (npm run dev).
# Uso: docker compose up -d
services:
  db:
    image: postgres:18-alpine # misma versión que en Coolify
    restart: unless-stopped
    environment:
      POSTGRES_USER: toctar
      POSTGRES_PASSWORD: toctar
      POSTGRES_DB: toctar
    ports:
      - "5432:5432"
    volumes:
      # Desde PostgreSQL 18 el volumen se monta en /var/lib/postgresql
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toctar -d toctar"]
      interval: 5s
      timeout: 3s
      retries: 10

  almacenamiento:
    # Imita a Cloudflare R2 (API S3) para fotos y PDF. Consola: http://localhost:9001
    image: rustfs/rustfs:1.0.1
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: toctar-dev
      RUSTFS_SECRET_KEY: toctar-dev-secreto
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - almacenamiento-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
  almacenamiento-data:
